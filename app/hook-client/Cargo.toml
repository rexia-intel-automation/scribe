[package]
name = "scribe-hook"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local native hook transport for Scribe"

[features]
test-fixture = []

[dependencies]
scribe-hook-protocol = { path = "../hook-protocol" }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "io-std"] }
tokio-util = "0.7"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
