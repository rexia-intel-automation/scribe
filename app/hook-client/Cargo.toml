[package]
name = "scribe-hook"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local native hook transport for Scribe"

[dependencies]
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "=3.4.2", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
