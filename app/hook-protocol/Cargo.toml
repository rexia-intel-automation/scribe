[package]
name = "scribe-hook-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
hmac = "=0.12.1"
sha2 = "=0.10.9"
base64 = "0.23"
serde_json = "1"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["user"] }

[dev-dependencies]
tempfile = "3"
