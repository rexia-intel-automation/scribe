[package]
name = "scribe-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local session state and authenticated HTTP server for Scribe"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23"
futures-util = "0.3"
rand = "0.10"
regex = "1"
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "libsqlite3-sys"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
tokio-util = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
