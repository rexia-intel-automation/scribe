name: Storage comparison

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/storage-benchmark.yml'
      - 'app/src-tauri/src/store.rs'

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare full-sync modes on the same runner
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path app/src-tauri/Cargo.toml --locked --lib storage_mode_round_robin -- --ignored --nocapture --test-threads=1 2>&1 | tee storage-comparison.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: storage-comparison-${{ matrix.runner }}
          path: storage-comparison.log
          if-no-files-found: error
          retention-days: 14
