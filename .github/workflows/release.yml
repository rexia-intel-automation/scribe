name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/prepare-release.mjs'
      - 'scripts/verification/release.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test scripts/verification/release.test.mjs scripts/verification/distribution.test.mjs
      - name: Validate tag and package versions
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          if [[ "$EVENT_NAME" == push ]]; then
            tag="$TAG_REF"
            git merge-base --is-ancestor "$source_sha" origin/main
          else
            tag="v$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          fi
          node scripts/prepare-release.mjs validate-tag --tag "$tag" --source-sha "$source_sha" > release-version.json
          echo "tag=$(jq -r .tag release-version.json)" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(jq -r .sourceSha release-version.json)" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r .prerelease release-version.json)" >> "$GITHUB_OUTPUT"
      - name: Require successful main CI for this exact source commit
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&branch=main&event=push&status=success&per_page=100" --jq '.workflow_runs[0].id // empty')
          test -n "$run_id"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '.jobs' > ci-jobs.json
          jq -s -e 'add | [.[] | select(.conclusion == "success") | .name] as $names | ["dependency-audit", "native-and-plugin (windows-latest)", "native-and-plugin (macos-latest)", "native-and-plugin (ubuntu-22.04)"] | all(. as $name | $names | index($name) != null)' ci-jobs.json

  bundles:
    needs: validate
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            bundle_root: app/src-tauri/target/release/bundle
            args: --config src-tauri/tauri.distribution.conf.json --bundles nsis,msi --ci -- --locked
          - platform: macos
            runner: macos-latest
            bundle_root: app/src-tauri/target/universal-apple-darwin/release/bundle
            args: --config src-tauri/tauri.distribution.conf.json --target universal-apple-darwin --bundles app,dmg --ci -- --locked
          - platform: linux
            runner: ubuntu-22.04
            bundle_root: app/src-tauri/target/release/bundle
            args: --config src-tauri/tauri.distribution.conf.json --bundles deb,appimage --ci -- --locked
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
      - name: Install universal macOS targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Linux bundle dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev patchelf wget
      - name: Ensure VBScript for MSI
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $capability = Get-WindowsCapability -Online -Name 'VBSCRIPT*' -ErrorAction Stop |
            Where-Object { $_.Name -like 'VBSCRIPT~~~~*' } | Select-Object -First 1
          if (-not $capability) { throw 'MSI requires the Windows VBScript capability.' }
          if ($capability.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $capability.Name -ErrorAction Stop | Out-Null
          }
          $capability = Get-WindowsCapability -Online -Name $capability.Name -ErrorAction Stop
          if ($capability.State -ne 'Installed' -or -not (Test-Path (Join-Path $env:WINDIR 'System32\vbscript.dll'))) {
            throw 'VBScript is not available for the MSI build.'
          }
      - run: npm ci --prefix app --ignore-scripts
      - name: Build and stage matching native helper
        run: node scripts/build-distribution.mjs prepare --platform ${{ matrix.platform }}
      - name: Build bundles without publishing
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        with:
          projectPath: app
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: false
      - name: Verify bundle set, architectures and checksums
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: node scripts/build-distribution.mjs finalize --platform ${{ matrix.platform }} --bundle-root ${{ matrix.bundle_root }} --artifact-dir .artifacts/release-build/${{ matrix.platform }} --source-sha "$SOURCE_SHA"
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.platform }}
          path: .artifacts/release-build/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: [validate, bundles]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: .artifacts/release-build
      - name: Verify downloaded platform artifacts and prepare release
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: node scripts/prepare-release.mjs collect --input-root .artifacts/release-build --output-dir .artifacts/release-verified --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-release
          path: .artifacts/release-verified/*
          if-no-files-found: error
          retention-days: 14

  install-smoke:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [validate, bundles, verify]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - bundle: nsis
            runner: windows-latest
          - bundle: msi
            runner: windows-latest
          - bundle: dmg
            runner: macos-latest
          - bundle: deb
            runner: ubuntu-22.04
          - bundle: appimage
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: .artifacts/install-input
      - name: Install Linux virtual display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11
      - name: Install AppImage FUSE dependency
        if: matrix.bundle == 'appimage'
        run: sudo apt-get install -y libfuse2
      - name: Test installed app and helper on Windows or macOS
        if: runner.os != 'Linux'
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          BUNDLE: ${{ matrix.bundle }}
        run: node scripts/verification/installed-package-smoke.mjs --input-root .artifacts/install-input --bundle "$BUNDLE" --source-sha "$SOURCE_SHA" --tag "$RELEASE_TAG"
      - name: Test installed app and helper on Linux
        if: runner.os == 'Linux'
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          BUNDLE: ${{ matrix.bundle }}
        run: xvfb-run --auto-servernum dbus-run-session -- node scripts/verification/installed-package-smoke.mjs --input-root .artifacts/install-input --bundle "$BUNDLE" --source-sha "$SOURCE_SHA" --tag "$RELEASE_TAG"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate, bundles, verify, install-smoke]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: .artifacts/release-build
      - name: Recheck platform inputs before publication
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: node scripts/prepare-release.mjs collect --input-root .artifacts/release-build --output-dir .artifacts/release-verified --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA"
      - name: Create a new release and publish only after successful upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          test "$remote_sha" = "$SOURCE_SHA"
          files=(.artifacts/release-verified/*)
          gh release create "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Scribe $RELEASE_TAG" --notes-file .artifacts/release-verified/RELEASE-NOTES.md
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi
