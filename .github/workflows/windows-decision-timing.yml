name: Windows decision timing

on:
  pull_request:
    paths:
      - '.github/workflows/windows-decision-timing.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build the same desktop frontend as the native CI
        working-directory: app
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Trace the existing paced signed decision test with public temporary data
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --locked --features desktop,decision-timing --test core permission_choices_deliver_signed_hook_responses_under_100ms_p95 -- --exact --test-threads=1 --nocapture
